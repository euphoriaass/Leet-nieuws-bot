name: Leet nieuws checker

on:
  schedule:
    - cron: "*/10 * * * *"   # elke 10 minuten
  workflow_dispatch:          # handmatig starten via de Actions-tab

permissions:
  contents: write

concurrency:
  group: news-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Check nieuws
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python check_news.py

      - name: Opslaan wat al gezien is
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "Update seen.json" && git push)
